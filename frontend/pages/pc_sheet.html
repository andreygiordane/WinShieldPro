<section id="view-pc-sheet" class="view-panel hidden ws-page">

                <div class="ws-card">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div class="min-w-0">
                            <div class="ws-card-title">Ficha do PC</div>
                            <div class="ws-card-sub">A configuração completa desta máquina, pronta para responder "qual é a configuração do seu PC?". Somente dados lidos do Windows e do hardware.</div>
                        </div>
                        <div class="flex flex-wrap gap-2 flex-shrink-0">
                            <button onclick="copyPcSheet(false)" class="ws-btn">Copiar resumo</button>
                            <button onclick="copyPcSheet(true)" class="ws-btn">Copiar ficha completa</button>
                            <button onclick="exportPcSheet()" class="ws-btn primary">Salvar TXT + HTML</button>
                        </div>
                    </div>
                    <label class="ws-check mt-3"><input type="checkbox" id="sheet-private" onchange="loadPcSheet(true)">Incluir números de série, endereço MAC e nome do computador</label>
                </div>

                <div class="ws-card">
                    <span class="ws-stat-label block mb-1.5">Resumo</span>
                    <div id="sheet-summary" class="ws-mono ws-strong text-[13.5px] leading-relaxed select-all">Lendo o hardware…</div>
                </div>

                <div id="sheet-sections" class="grid grid-cols-1 xl:grid-cols-2 gap-3"></div>
            </section>
