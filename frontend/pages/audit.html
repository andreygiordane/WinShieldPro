<section id="view-audit" class="view-panel hidden space-y-4">
                <div
                    class="flex flex-wrap items-center justify-between gap-3 bg-dark-850 p-4 rounded-2xl border border-slate-800">
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="runAuditAction('registry')" id="audit-subtab-btn-registry"
                            class="subtab-btn audit-subtab-btn active">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i>
                            <span>Registro (Apps Ocultos)</span>
                        </button>
                        <button onclick="runAuditAction('appx')" id="audit-subtab-btn-appx"
                            class="subtab-btn audit-subtab-btn">
                            <i data-lucide="package" class="w-3.5 h-3.5"></i>
                            <span>Pacotes AppX / UWP</span>
                        </button>
                        <button onclick="runAuditAction('services')" id="audit-subtab-btn-services"
                            class="subtab-btn audit-subtab-btn">
                            <i data-lucide="cog" class="w-3.5 h-3.5"></i>
                            <span>Serviços Terceiros</span>
                        </button>
                        <button onclick="runAuditAction('startup')" id="audit-subtab-btn-startup"
                            class="subtab-btn audit-subtab-btn">
                            <i data-lucide="play" class="w-3.5 h-3.5"></i>
                            <span>Inicialização Automática</span>
                        </button>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="unhideSelectedItem()"
                            class="btn-action-secondary flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-bold text-amber-300 border-amber-500/40 hover:border-amber-400">
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            <span>Desocultar no Painel</span>
                        </button>
                        <button onclick="uninstallSelectedItem()"
                            class="btn-action-secondary flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-bold text-rose-300 border-rose-500/40 hover:border-rose-400">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            <span>Desinstalar</span>
                        </button>
                        <button onclick="forceShredSelectedItem()"
                            class="btn-action-danger flex items-center space-x-2 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">
                            <i data-lucide="flame" class="w-3.5 h-3.5"></i>
                            <span>Exclusão Forçada (Shred)</span>
                        </button>
                    </div>
                </div>

                <!-- TABELA DE RESULTADOS DA AUDITORIA -->
                <div class="bg-dark-850 rounded-2xl border border-slate-800 p-4">
                    <div class="flex items-center justify-between mb-3">
                        <span id="audit-count-badge" class="text-xs text-slate-400 font-mono">Pronto para
                            escanear</span>
                        <input type="text" oninput="filterAuditTable(this.value)"
                            placeholder="Filtrar por nome ou caminho..."
                            class="bg-dark-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 min-w-[220px]">
                    </div>
                    <div class="overflow-x-auto max-h-[460px] overflow-y-auto rounded-xl border border-slate-800">
                        <table class="w-full text-left border-collapse text-xs font-mono">
                            <thead>
                                <tr
                                    class="bg-dark-750 text-slate-400 uppercase sticky top-0 bg-dark-800 border-b border-slate-700">
                                    <th class="py-2.5 px-4 font-sans">Nome do Aplicativo</th>
                                    <th class="py-2.5 px-4">Versão</th>
                                    <th class="py-2.5 px-4">Editor</th>
                                    <th class="py-2.5 px-4">Origem</th>
                                    <th class="py-2.5 px-4">Status Painel</th>
                                    <th class="py-2.5 px-4 font-sans">Localização / Executável</th>
                                </tr>
                            </thead>
                            <tbody id="audit-table-body" class="divide-y divide-slate-800">
                                <tr>
                                    <td colspan="6" class="py-8 text-center text-slate-400 font-sans">Clique em um dos
                                        botões acima para iniciar a varredura profunda.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
