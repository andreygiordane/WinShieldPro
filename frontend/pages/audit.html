<section id="view-audit" class="view-panel hidden ws-page">

                <div class="flex flex-wrap items-end justify-between gap-3">
                    <div class="ws-tabs flex-1 min-w-0">
                        <button onclick="runAuditAction('registry')" id="audit-subtab-btn-registry" class="audit-subtab-btn active">Programas instalados</button>
                        <button onclick="runAuditAction('appx')" id="audit-subtab-btn-appx" class="audit-subtab-btn">Apps da Store (AppX)</button>
                        <button onclick="runAuditAction('services')" id="audit-subtab-btn-services" class="audit-subtab-btn">Serviços de terceiros</button>
                        <button onclick="runAuditAction('startup')" id="audit-subtab-btn-startup" class="audit-subtab-btn">Inicialização</button>
                    </div>
                </div>

                <div class="ws-card ws-card-flush">
                    <div class="ws-card-head">
                        <div class="flex items-center gap-3 flex-wrap">
                            <input type="text" oninput="filterAuditTable(this.value)" placeholder="Filtrar por nome ou caminho" class="ws-input w-64">
                            <span id="audit-count-badge" class="ws-muted text-[12px] ws-mono">—</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="ws-stat-foot hidden lg:inline">Selecione uma linha e escolha a ação:</span>
                            <button onclick="unhideSelectedItem()" class="ws-btn sm">Mostrar no Painel</button>
                            <button onclick="uninstallSelectedItem()" class="ws-btn sm">Desinstalar</button>
                            <button onclick="forceShredSelectedItem()" class="ws-btn sm danger" title="Remove arquivos e registro mesmo sem desinstalador">Remoção forçada</button>
                        </div>
                    </div>
                    <div class="overflow-auto max-h-[620px]">
                        <table class="ws-table">
                            <thead><tr><th>Nome</th><th>Versão</th><th>Editor</th><th>Origem</th><th>Painel de Controle</th><th>Local / executável</th></tr></thead>
                            <tbody id="audit-table-body"><tr><td colspan="6" class="ws-empty">Escolha uma categoria acima para listar.</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </section>
