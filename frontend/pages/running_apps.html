<section id="view-running-apps" class="view-panel hidden ws-page">

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div class="ws-card ws-stat"><span class="ws-stat-label" data-i18n="apps.stat_user_apps">Aplicativos abertos</span><span id="stat-apps-user-count" class="ws-stat-value ws-mono">—</span><span class="ws-stat-foot">programas com janela ou instalados</span></div>
                    <div class="ws-card ws-stat"><span class="ws-stat-label" data-i18n="apps.stat_services">Processos do Windows</span><span id="stat-apps-services-count" class="ws-stat-value ws-mono">—</span><span class="ws-stat-foot">serviços e processos do sistema</span></div>
                    <div class="ws-card ws-stat"><span class="ws-stat-label" data-i18n="apps.stat_ram">Memória dos aplicativos</span><span id="stat-apps-ram" class="ws-stat-value ws-mono">—</span><span class="ws-stat-foot">soma do working set</span></div>
                </div>

                <div class="ws-card ws-card-flush">
                    <div class="ws-card-head">
                        <div class="flex items-center gap-3 flex-wrap">
                            <div class="ws-seg">
                                <button onclick="setRunningAppsCategoryFilter('user_app')" id="filter-apps-user" class="active"><span data-i18n="apps.tab_my_apps">Aplicativos</span><span id="badge-count-user-apps" class="ws-mono ws-faint">0</span></button>
                                <button onclick="setRunningAppsCategoryFilter('windows_service')" id="filter-apps-service"><span data-i18n="apps.tab_services">Sistema</span><span id="badge-count-services" class="ws-mono ws-faint">0</span></button>
                                <button onclick="setRunningAppsCategoryFilter('all')" id="filter-apps-all"><span data-i18n="apps.tab_all">Todos</span></button>
                            </div>
                            <span id="running-apps-count-badge" class="ws-muted text-[12px] ws-mono">—</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="text" id="running-apps-search" oninput="renderRunningAppsTable()" placeholder="Buscar nome, executável ou janela" data-i18n-placeholder="apps.search_placeholder" class="ws-input w-56 sm:w-72">
                            <button onclick="loadRunningApps(true)" class="ws-btn sm"><i data-lucide="refresh-cw" id="btn-refresh-apps-icon"></i><span data-i18n="apps.refresh">Atualizar</span></button>
                        </div>
                    </div>
                    <div class="overflow-auto max-h-[640px]">
                        <table class="ws-table">
                            <thead>
                                <tr><th data-i18n="apps.th_app">Processo</th><th data-i18n="apps.th_category">Tipo</th><th data-i18n="apps.th_window">Janela / caminho</th><th data-i18n="apps.th_ram">Memória</th><th class="text-right" data-i18n="apps.th_action">Ações</th></tr>
                            </thead>
                            <tbody id="running-apps-tbody">
                                <tr><td colspan="5" class="ws-empty" data-i18n="apps.loading">Lendo processos em execução…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
