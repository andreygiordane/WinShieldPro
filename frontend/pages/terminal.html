<section id="view-terminal" class="view-panel hidden ws-page">

                <div class="ws-card">
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div class="ws-seg">
                            <label class="ws-seg-radio"><input type="radio" name="shell-mode" value="POWERSHELL" checked><span data-i18n="terminal.ps_admin">PowerShell</span></label>
                            <label class="ws-seg-radio"><input type="radio" name="shell-mode" value="CMD"><span data-i18n="terminal.cmd_admin">CMD</span></label>
                        </div>
                        <span class="ws-stat-foot" data-i18n="terminal.elevated_badge">Executado de forma oculta, com os privilégios do WinShield · limite de 60 s</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="terminal-input" onkeydown="if(event.key==='Enter') executeCustomCommand()" placeholder="Comando (ex.: Get-Process | Select-Object -First 10)" data-i18n-placeholder="terminal.input_placeholder" class="ws-input flex-1 ws-mono">
                        <button onclick="executeCustomCommand()" class="ws-btn primary"><span data-i18n="terminal.btn_run">Executar</span></button>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 mt-4">
                        <span class="ws-stat-label mr-1" data-i18n="terminal.chips_label">Atalhos</span>
                        <button onclick="setTerminalCmd('netstat -ano | findstr ESTABLISHED', 'CMD')" class="ws-chip-btn"><span data-i18n="terminal.chip_connections">Conexões ativas</span></button>
                        <button onclick="setTerminalCmd('Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 10', 'POWERSHELL')" class="ws-chip-btn"><span data-i18n="terminal.chip_top_ram">Top 10 em memória</span></button>
                        <button onclick="setTerminalCmd('Get-PhysicalDisk | Select-Object DeviceId, FriendlyName, MediaType, HealthStatus, Size', 'POWERSHELL')" class="ws-chip-btn"><span data-i18n="terminal.chip_disks">Discos físicos</span></button>
                        <button onclick="setTerminalCmd('Get-MpComputerStatus', 'POWERSHELL')" class="ws-chip-btn"><span data-i18n="terminal.chip_defender">Status do Defender</span></button>
                    </div>
                </div>

                <div id="terminal-execution-window" class="hidden ws-card ws-card-flush">
                    <div class="ws-card-head">
                        <div class="flex items-center gap-3">
                            <span id="term-exec-shell-badge" class="ws-badge ws-mono">POWERSHELL</span>
                            <span id="term-exec-status" class="text-[12.5px] ws-muted">Executando…</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span id="term-exec-timer" class="ws-mono text-[12px] ws-muted mr-2">0.0s</span>
                            <button onclick="copyTerminalOutput()" class="ws-btn sm ghost"><span data-i18n="terminal.btn_copy">Copiar</span></button>
                            <button onclick="clearTerminalExecution()" class="ws-btn sm ghost"><span data-i18n="terminal.btn_clear">Limpar</span></button>
                            <button onclick="document.getElementById('terminal-execution-window').classList.add('hidden')" class="ws-icon-btn" title="Fechar"></button>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="ws-mono text-[12.5px] mb-2"><span class="ws-faint">&gt;</span> <span id="term-exec-cmd-text" class="ws-strong select-all">—</span></div>
                        <div id="term-exec-output" class="ws-console max-h-[480px] select-text"></div>
                    </div>
                </div>
            </section>
